[cap]
; live mode = the NPU pipeline. Without mode=live the DLL silently falls back
; to naive bilinear. count is capture-frame budget (0 = unlimited for play).
; wire=3/mapn2/slots3/simdmv select the wire class the whitepaper measured
; (raw MV rows + jitter/MV-scale tail, 3 frame slots, deferred-2 readback,
; SIMD MV convert off the game thread). Without them the proxy runs wire v2:
; it still works, just one protocol class slower on the game thread.
mode=live
live_port=48620
count=0
wire=3
mapn2=1
slots3=1
simdmv=1
